    const tabs = (m === "signup" || m === "login") && !registered() ? `<div class="acc-tabs" role="tablist"><button type="button" role="tab" data-act="mode" data-m="signup" aria-selected="${m === "signup"}">I'm new here</button><button type="button" role="tab" data-act="mode" data-m="login" aria-selected="${m === "login"}">I already have an account</button></div>` : "";
    el.innerHTML = `<div class="panel leadgate acct" role="dialog" aria-modal="true" aria-labelledby="acc-title">
      ${m === "profile" ? "" : `<img class="logo" src="${ASSETS}arivupro-icon.webp" alt="ArivuPro"><div class="eyebrow">ArivuPro Academy · Rank Road</div>`}${tabs}
      <form novalidate>${body}${M.top ? `<div class="acc-top ${M.tone}">${M.top}</div>` : ""}
      ${go ? `<button class="btn ${goCls}" type="submit" ${M.busy ? "disabled" : ""}>${M.busy ? "Please wait…" : go}</button>` : ""}</form>${foot}</div>`;
    resendLabel();
    const focusEl = el.querySelector(".acc-f.has-err input") || (focusFirst && [...el.querySelectorAll("form input")].find(i => !i.value));
    if (focusEl && !M.busy) setTimeout(() => focusEl.focus(), 30);
  }
  function resendLabel() {
    const b = document.getElementById("acc-resend"); if (!b || !M) return;
    const s = Math.ceil((M.resendAt - Date.now()) / 1000);
    b.textContent = s > 0 ? `send a new code (in ${s} s)` : "send a new code";
    b.disabled = s > 0;
  }
  function onInput(e) {
    const f = e.target.dataset && e.target.dataset.f; if (!f || !M) return;
    M[f] = e.target.value;
    const key = f === "cc" ? "phone" : f, box = e.target.closest(".acc-f");
    if (M.err[key] && !(f === "email" && e.type === "change")) { M.err[key] = ""; if (box) { box.classList.remove("has-err"); box.querySelector(".lead-err").innerHTML = ""; } }
    if (f === "cc") { const ph = $("#acc-phone"); if (ph) ph.placeholder = M.cc === "IN" ? "10-digit mobile number" : "Mobile number"; }
  }
  function setMode(mode) {
    M.mode = mode; M.err = {}; M.top = ""; M.tone = ""; M.pw = ""; M.pw0 = ""; M.code = ""; M.verified = null; M.busy = false;
    if (mode === "upgrade") M.askPhone = !splitPhone(S.phone).valid;
    if (mode === "chgemail") M.email = "";
    if (mode === "name") M.name = S.name || "";
    if (mode === "forgot" && user) M.email = user.email;
    render(true);
  }
  async function onClick(e) {
    if (e.target.classList.contains("acctmodal") && M && PROFILE_MODES.includes(M.mode) && !M.busy) return closeModal();   // tap outside closes the profile menu
    const b = e.target.closest("[data-act]"); if (!b || !M || M.busy) return;
    const a = b.dataset.act;
    if (a === "mode") setMode(b.dataset.m);
    else if (a === "eye") { M.showPw = !M.showPw; render(); const i = document.getElementById("acc-" + (b.dataset.for || "pw")); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
    else if (a === "later") { try { sessionStorage.setItem(LATER, "1"); } catch (x) {} closeModal(); }
    else if (a === "close") closeModal();
    else if (a === "change") setMode(M.prev === "login" ? "login" : M.prev);
    else if (a === "sugg-yes") { M.email = b.dataset.v; M.err.email = ""; render(); }
    else if (a === "sugg-no") { M.noSugg = M.email; M.err.email = ""; render(); }
    else if (a === "logout" || a === "logout-force") {
      busy(true);
      const r = await logout(a === "logout-force");
      if (r === "unsaved" && M) { M.busy = false; M.tone = ""; M.top = `Some changes aren't saved to your account yet (no internet). <button type="button" class="linkbtn" data-act="logout-force">Log out anyway</button>`; render(); }
    }
    else if (a === "resend") {
      if (Date.now() < M.resendAt) return;
      M.resendAt = Date.now() + 60000; resendLabel();
      try {
        await client();
        const {error} = M.mode === "reset" ? await sb.auth.resetPasswordForEmail(M.email)
          : M.mode === "emailcode" ? await sb.auth.resend({type: "email_change", email: M.email})
          : await sb.auth.resend({type: "signup", email: M.email});
        if (error) throw error;
        M.verified = null;
        M.top = "We've sent you a new code — please use the newest one. In Gmail it may appear inside the earlier email."; M.tone = "info";
      } catch (x) { M.top = authMsg(x, "resend"); M.tone = ""; }
      render();
    }
  }
  function busy(v) { M.busy = v; render(); }
  function fail(msg) { M.top = msg; M.tone = ""; M.busy = false; render(); }
  async function submit() {
    if (!M || M.busy) return;
    M.err = {}; M.top = ""; M.tone = "";
    const fn = {signup: doSignup, upgrade: doSignup, login: doLogin, code: doVerify, forgot: doForgot, reset: doReset,
                name: doName, chgpw: doChangePassword, chgemail: doChangeEmail, emailcode: doEmailCode, clear: doClear}[M.mode];
    if (!fn) return;
    try { await fn(); }
    catch (e) { if (M) fail(authMsg(e, ["code", "reset", "emailcode"].includes(M.mode) ? "code" : M.mode)); }
  }
  async function doSignup() {
    const kind = M.mode;
    const name = (M.askName || kind === "signup" ? M.name : S.name || M.name || "").trim();
    if ((M.askName || kind === "signup") && !name) M.err.name = "Please type your name.";
    let ph = null;
    if (M.askPhone) { const r = phoneCheck(M.cc, M.phone); if (r.err) M.err.phone = r.err; else ph = r; }
    else { const o = splitPhone(S.phone); ph = {e164: o.cc === "IN" ? "+91" + o.national : S.phone, country: o.cc}; }
    if ((M.pw || "").length < MIN_PW) M.err.pw = "Please use at least 8 characters.";
    if (!navigator.onLine) return fail(OFFLINE);
    busy(true);
    const ok = await checkEmail(true);
    if (!ok || Object.values(M.err).some(Boolean)) return busy(false);
    await client();
    const meta = {name, phone: ph.e164, country: ph.country, source: kind === "upgrade" ? "old-form" : "signup"};
    if (COURSE) meta.course = COURSE;
    const {data, error} = await sb.auth.signUp({email: M.email, password: M.pw, options: {data: meta}});
    if (error) return fail(authMsg(error, "signup"));
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) { M.err.email = existsMsg(); return busy(false); }
    M.info = {kind, name, phone: ph.e164, country: ph.country};
    if (data.session) { user = data.session.user; return finishAccount(); }
    M.prev = kind; M.mode = "code"; M.code = ""; M.next = "account"; M.resendAt = Date.now() + 60000;
    busy(false);
  }
  async function doVerify() {
    const code = (M.code || "").replace(/\D/g, "");
    if (code.length < 6) { M.err.code = "Please type the 6-digit code from the email."; return render(); }
    if (!navigator.onLine) return fail(OFFLINE);
    busy(true); await client();
    let r = await sb.auth.verifyOtp({email: M.email, token: code, type: "email"});
    if (r.error) { const r2 = await sb.auth.verifyOtp({email: M.email, token: code, type: "signup"}); if (!r2.error) r = r2; }
    if (r.error) return fail(authMsg(r.error, "code"));
    user = (r.data.session && r.data.session.user) || r.data.user;
    if (M.next === "account") return finishAccount();
    return afterLogin();
  }
  async function finishAccount() {
    const i = M.info;
    await afterAccount(i);
    closeModal(); headerBtn();
    const nm = S.name.split(" ")[0] || "friend";
    if (!IN_APP) {
      const c = i.kind === "upgrade" ? localCourse() : null;
      if (c && FOLDER[c]) {
        try { const r = await sb.auth.updateUser({data: {course: c}}); if (r && r.data && r.data.user) user = r.data.user; } catch (e) {}
        toast("Done! Your progress is saved. Opening your plan…", 3000); location.href = FOLDER[c]; return;
      }
      toast("All set, " + nm + "! Now pick your course below.", 4500); scrollToCourses(); return;
    }
    refreshHeader();
    if (i.kind === "upgrade") { rememberCourse(); show(currentTab()); toast("Done! Your progress is saved. On a new phone, just log in with your email and password.", 5000); }
    else { show(S.plan ? currentTab() : "plan"); toast("All set, " + nm + "! Now let's plan your exam.", 4000); }
  }
  async function doLogin() {
    const ok = await checkEmail(false);
    if (!M.pw) M.err.pw = "Please type your password.";
    if (!ok || M.err.pw) return render();
    if (!navigator.onLine) return fail(OFFLINE);
    busy(true); await client();
    const {data, error} = await sb.auth.signInWithPassword({email: M.email, password: M.pw});
    if (error) {
      if (/not confirmed/i.test(error.message || "")) {
        try { await sb.auth.resend({type: "signup", email: M.email}); } catch (x) {}
        M.prev = "login"; M.mode = "code"; M.next = "login"; M.code = ""; M.resendAt = Date.now() + 60000;
        M.top = "Your email isn't confirmed yet — we've sent you a new code."; M.tone = "info";
        return busy(false);
      }
      return fail(authMsg(error, "login"));
    }
    user = data.user;
    return afterLogin();
  }
  async function doForgot() {
    if (!(await checkEmail(false))) return render();
    if (!navigator.onLine) return fail(OFFLINE);
    busy(true); await client();
    const {error} = await sb.auth.resetPasswordForEmail(M.email);
    if (error) return fail(authMsg(error, "forgot"));
    M.mode = "reset"; M.prev = "forgot"; M.code = ""; M.pw = ""; M.resendAt = Date.now() + 60000;
    busy(false);
  }
  async function doReset() {
    const code = (M.code || "").replace(/\D/g, "");
    if (code.length < 6) M.err.code = "Please type the 6-digit code from the email.";
    if ((M.pw || "").length < MIN_PW) M.err.pw = "Please use at least 8 characters.";
    if (M.err.code || M.err.pw) return render();
    if (!navigator.onLine) return fail(OFFLINE);
    busy(true); await client();
    if (M.verified !== code) {                                           // a code works once; if only the password was rejected, don't re-send the code
      const r = await sb.auth.verifyOtp({email: M.email, token: code, type: "recovery"});
      if (r.error) return fail(authMsg(r.error, "code"));
      user = (r.data.session && r.data.session.user) || r.data.user;
      M.verified = code;
    }
    const u = await sb.auth.updateUser({password: M.pw});
    if (u.error) return fail(authMsg(u.error, "reset"));
    return afterLogin("Your new password is saved. Welcome back" + (S.name ? ", " + S.name.split(" ")[0] : "") + "!");
  }

  /* ---------------- profile actions ---------------- */
  async function checkCurrentPassword() {
    if (!M.pw0) { M.err.pw0 = "Please type your current password."; return false; }
    const {error} = await sb.auth.signInWithPassword({email: user.email, password: M.pw0});
    if (error) { M.err.pw0 = /invalid login/i.test(error.message || "") ? "Your current password is not correct." : authMsg(error, "login"); return false; }
    return true;
  }
  async function doName() {
    const name = (M.name || "").trim();
    if (!name) { M.err.name = "Please type your name."; return render(); }
    S.name = name;
    if (IN_APP) save(); persistProfile();
    if (user && navigator.onLine) {
      sb.from("students").update({name}).eq("id", user.id).then(() => {}, () => {});
      sb.auth.updateUser({data: {name}}).then(r => { if (r && r.data && r.data.user) user = r.data.user; }, () => {});
    }
    if (IN_APP) refreshHeader(); else headerBtn();
    setMode("profile"); toast("Your name is saved.");
  }
  async function doChangePassword() {
    if ((M.pw || "").length < MIN_PW) M.err.pw = "Please use at least 8 characters.";
    if (!M.pw0) M.err.pw0 = "Please type your current password.";
    if (M.err.pw || M.err.pw0) return render();
    if (!navigator.onLine) return fail(OFFLINE);
    busy(true); await client();
    if (!(await checkCurrentPassword())) return busy(false);
    const u = await sb.auth.updateUser({password: M.pw});
    if (u.error) return fail(authMsg(u.error, "reset"));
    setMode("profile"); toast("Your password is changed.", 3500);
  }
  async function doChangeEmail() {
    if (!navigator.onLine) return fail(OFFLINE);
    busy(true); await client();
    const ok = await checkEmail(true);
    if (ok && user && M.email === (user.email || "").toLowerCase()) M.err.email = "That's already your email.";
    if (!M.pw0) M.err.pw0 = "Please type your password.";
    if (!ok || M.err.email || M.err.pw0) return busy(false);
    if (!(await checkCurrentPassword())) return busy(false);
    const {error} = await sb.auth.updateUser({email: M.email});
    if (error) { if (/already|exists|registered/i.test(error.message || "")) { M.err.email = "Another account already uses this email."; return busy(false); } return fail(authMsg(error, "chgemail")); }
    M.mode = "emailcode"; M.code = ""; M.resendAt = Date.now() + 60000;
    busy(false);
  }
  async function doEmailCode() {
    const code = (M.code || "").replace(/\D/g, "");
    if (code.length < 6) { M.err.code = "Please type the 6-digit code from the email."; return render(); }
    if (!navigator.onLine) return fail(OFFLINE);
    busy(true); await client();
    const r = await sb.auth.verifyOtp({email: M.email, token: code, type: "email_change"});
    if (r.error) return fail(authMsg(r.error, "code"));
    user = r.data.user || (r.data.session && r.data.session.user) || (await sb.auth.getUser()).data.user;
    S.email = user.email || M.email; persistProfile();
    if (IN_APP) save();
    sb.from("students").update({email: S.email}).eq("id", user.id).then(() => {}, () => {});
    sendLead({name: S.name, phone: S.phone, email: S.email, account: "Yes"}).catch(() => {});
    setMode("profile"); toast("Your email is now " + S.email + ".", 4000);
  }
  function doClear() {
    if (!IN_APP) return;
    S = {name: S.name, phone: S.phone, email: S.email, leadSent: S.leadSent, days: {}, scores: {}, tests: {}, rating: {}, errs: {}, seenBadges: [],
         plan: S.plan ? {settings: S.plan.settings, from: null, remain: {}, mocksDone: 0, frozen: []} : null};
    save(); flush(); regen(); selDay = defaultDay();
    prevBadges = new Set(badgeList().filter(b => b[3]).map(b => b[1]));
    closeModal(); refreshHeader(); show(currentTab()); toast("Your progress is cleared.");
  }

  /* ---------------- header button ---------------- */
  function statusText() {
    if (!navigator.onLine) return "You're offline — your changes will be saved to your account when you're back online.";
    if (IN_APP && getMeta(COURSE).dirty) return lastErr ? "Couldn't save to your account just now — we'll keep trying." : "Saving to your account…";
    return "✓ Your progress is saved to your account" + (lastSaved ? " (last saved " + new Date(lastSaved).toLocaleTimeString("en-IN", {hour: "numeric", minute: "2-digit"}) + ")." : ".");
  }
  function statusRefresh() { const el = document.getElementById("acctstatus"); if (el) el.textContent = statusText(); }
  function headerBtn() {
    const slot = document.getElementById("profslot"); if (!slot) return;
    let h;
    if (user) {
      const nm = (S.name || user.email || "?").trim(), c = myCourse();
      h = (!IN_APP && c ? `<a class="btn gold" href="${FOLDER[c]}">Go to my plan</a>` : "")
        + `<button type="button" class="profbtn" id="profbtn" aria-label="Your profile" title="Your profile"><span class="av">${esc(nm.charAt(0).toUpperCase())}</span><span class="pn">${esc(nm.split(/[\s@]/)[0])}</span></button>`;
    } else if (IN_APP) {
      h = `<button type="button" class="btn ${registered() ? "gold" : "ghost"}" id="proflogin">${registered() ? "Save my progress" : "Log in"}</button>`;
    } else {
      h = `<button type="button" class="btn ghost" id="proflogin">Log in</button><button type="button" class="btn gold" id="profsignup">Sign up</button>`;
    }
    if (slot.innerHTML !== h) slot.innerHTML = h;
    const pb = document.getElementById("profbtn"), pl = document.getElementById("proflogin"), ps = document.getElementById("profsignup");
    if (pb) pb.onclick = () => openModal("profile", {canLater: true});
    if (pl) pl.onclick = () => openModal(IN_APP && registered() ? "upgrade" : "login", {canLater: true});
    if (ps) ps.onclick = () => openModal(registered() ? "upgrade" : "signup", {canLater: true});
  }

  /* ---------------- start ---------------- */
  function tagVisit() {
    try { if (window.clarity) { clarity("set", "rr_page", COURSE || "home"); clarity("set", "rr_logged_in", user ? "yes" : "no"); } } catch (e) {}
  }
  function maybePrompt() {
    if (user || M || document.querySelector(".modal") || !navigator.onLine) return;
    if (registered()) { let later = false; try { later = !!sessionStorage.getItem(LATER); } catch (e) {} if (!later) openModal("upgrade"); }
    else if (IN_APP) openModal("signup");                              // new students sign up after choosing their course
  }
  function savedSessionCourse() {
    try { const s = JSON.parse(localStorage.getItem(SB_SESSION)); const u = (s && (s.user || (s.currentSession && s.currentSession.user))) || null; return u && u.user_metadata && u.user_metadata.course; }
    catch (e) { return null; }
  }
  async function boot() {
    if (!IN_APP && !/[?&]courses\b/.test(location.search)) {           // logged-in student on the home page: go straight to their plan
      const c = savedSessionCourse();
      if (c && FOLDER[c]) { location.replace(FOLDER[c]); return; }
    }
    addEventListener("online", () => { if (user) syncDirty(); else maybePrompt(); statusRefresh(); });
    addEventListener("offline", statusRefresh);
    if (IN_APP) document.addEventListener("visibilitychange", () => {
      if (!user) return;
      if (document.visibilityState === "hidden" && getMeta(COURSE).dirty) push(COURSE).catch(() => {});
      if (document.visibilityState === "visible") pull(COURSE).catch(() => {});
    });
    headerBtn();
    let hasSession = false; try { hasSession = !!localStorage.getItem(SB_SESSION); } catch (e) {}
    if (!hasSession) { tagVisit(); if (navigator.onLine) client().catch(() => {}); maybePrompt(); return; }
    try { await client(); const {data} = await sb.auth.getSession(); user = data.session ? data.session.user : null; } catch (e) { return; }
    headerBtn(); tagVisit();
    if (!user) { maybePrompt(); return; }
    sb.auth.onAuthStateChange((ev, s) => { if (ev === "SIGNED_OUT") { user = null; headerBtn(); } else if (s) user = s.user; });
    if (!IN_APP) return;
    rememberCourse();
    try { await pull(COURSE); await syncDirty(); } catch (e) {}
    statusRefresh();
  }
  return {boot, changed, headerBtn, open: openModal, loggedIn: () => !!user, _merge: merge, _phoneCheck: phoneCheck, _suggest: suggest};
})();
