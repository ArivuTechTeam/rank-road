<style>

<title>Rank Road Inter Group II</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F3F6F2; --surface:#FFFFFF; --surface-2:#E8EFE9; --ink:#000000; --ink-2:#010101; --line:#D3DED6;
  --brand:#2E8857; --brand-ink:#FFFFFF; --sage:#8FB29C; --gold:#D9981E; --gold-soft:#FBEFD6; --sb-gold:#D9981E;
  --hl-bg:radial-gradient(circle at 25% 45%, #1d6a3b 0%, #114929 100%);
  --btn-grad:linear-gradient(140deg,#35a066,#14512c);
  --pill-grad:linear-gradient(140deg,var(--sb-gold),#f0c542);
  --fomo:#ea580c; --btn2-bg:#f4f8f6;
  --s1:#2E7153;--s2:#A34A2E;--s3:#2F5D8A;--s4:#1F7A80;--s5:#6B4A86;--s6:#9A6B00;--s7:#3F46A8;--s8:#A33A6B;
  --s1s:#E1F0E7;--s2s:#F8E4DC;--s3s:#DFE9F4;--s4s:#DCF1F2;--s5s:#ECE3F3;--s6s:#F6ECD2;--s7s:#E3E5F8;--s8s:#F6E0EA;
  --acc:#2E7153; --law:#A34A2E; --qa:#2F5D8A; --eco:#6B4A86;
  --acc-soft:#E1F0E7; --law-soft:#F8E4DC; --qa-soft:#DFE9F4; --eco-soft:#ECE3F3;
  --good:#2E8B57; --warn:#C27C0E; --bad:#B8402E;
  --shadow:0 1px 2px rgba(21,35,27,.06),0 6px 20px rgba(21,35,27,.06);
  --r:14px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1713; --surface:#16211B; --surface-2:#1E2C24; --ink:#E6EEE8; --ink-2:#A2B4A8; --line:#2A3A31;
    --brand:#6FBF95; --brand-ink:#0F1713; --sage:#4E7A61; --gold:#F0B444; --gold-soft:#3A2E14;
  --s1:#6FC196;--s2:#E08A6C;--s3:#7FAEDD;--s4:#6CC6CB;--s5:#B99AD6;--s6:#E0B54E;--s7:#98A0F0;--s8:#E88DB6;
  --s1s:#1D3328;--s2s:#3A241C;--s3s:#1B2A3A;--s4s:#173334;--s5s:#2C2238;--s6s:#362B12;--s7s:#20233E;--s8s:#3A1D2B;
    --acc:#6FC196; --law:#E08A6C; --qa:#7FAEDD; --eco:#B99AD6;
    --acc-soft:#1D3328; --law-soft:#3A241C; --qa-soft:#1B2A3A; --eco-soft:#2C2238;
    --good:#5BC98A; --warn:#E6A93B; --bad:#E57560;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1713; --surface:#16211B; --surface-2:#1E2C24; --ink:#E6EEE8; --ink-2:#A2B4A8; --line:#2A3A31;
  --brand:#6FBF95; --brand-ink:#0F1713; --sage:#4E7A61; --gold:#F0B444; --gold-soft:#3A2E14;
  --s1:#6FC196;--s2:#E08A6C;--s3:#7FAEDD;--s4:#6CC6CB;--s5:#B99AD6;--s6:#E0B54E;--s7:#98A0F0;--s8:#E88DB6;
  --s1s:#1D3328;--s2s:#3A241C;--s3s:#1B2A3A;--s4s:#173334;--s5s:#2C2238;--s6s:#362B12;--s7s:#20233E;--s8s:#3A1D2B;
  --acc:#6FC196; --law:#E08A6C; --qa:#7FAEDD; --eco:#B99AD6;
  --acc-soft:#1D3328; --law-soft:#3A241C; --qa-soft:#1B2A3A; --eco-soft:#2C2238;
  --good:#5BC98A; --warn:#E6A93B; --bad:#E57560;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;flex:none;object-fit:cover}
.brand h1{font-size:19px;line-height:1.1}
.brand small{display:block;color:var(--ink-2);font-size:12.5px}
.stat{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px}
.stat b{font-family:var(--mono);font-size:15px}
.stat span{font-size:12px;color:var(--ink-2)}
.flame{width:20px;height:20px}
.lvl{min-width:180px}
@media (max-width:600px){
  .top{gap:8px;flex-wrap:wrap}
  .brand{flex:1 1 100%;margin-right:0}
  .stat{padding:4px 10px 4px 6px;gap:6px}
  .stat span{font-size:11px}
  .lvl{min-width:0;flex:1 1 0}
  .profslot{margin-left:auto;flex:none}
  .profslot .btn{padding:7px 10px;font-size:13px}
}
.lvlbar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:3px}
.lvlbar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .5s}

nav.tabs{display:flex;gap:4px;margin-block:14px 18px;overflow-x:auto;padding-bottom:2px}
nav.tabs button{border:1px solid transparent;background:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--hl-bg);color:#fff}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line);color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.countdown{background:var(--hl-bg);color:#fff;border:none;position:relative;overflow:hidden}
.countdown .eyebrow{color:inherit;opacity:.8}
.cd-row{display:flex;gap:18px;align-items:flex-end;margin-top:6px;flex-wrap:wrap}
.cd-att{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.attpill{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.countdown .linkbtn{color:#fff;font-size:13px}
.attbanner{margin-bottom:16px;border-color:var(--gold);background:var(--gold-soft);font-size:14.5px}
.attbanner.tip{border-color:var(--line);background:var(--surface)}
.attbanner a:not(.btn){color:var(--brand);font-weight:700}
.attbanner a.btn{text-decoration:none}
.cd-big{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.03em;color:var(--fomo)}
.cd-big small{font-size:18px;font-weight:600;letter-spacing:0;margin-left:6px;color:#fff}
.papers{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.paper{font-size:12.5px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:8px;padding:4px 8px}
.paper.done{opacity:.5;text-decoration:line-through}
.paper.next{background:color-mix(in srgb,currentColor 16%,transparent);font-weight:700}
.quote{font-size:15.5px;line-height:1.45}
.quote b{font-family:var(--display)}

/* day */
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.daynav h2{font-size:26px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink-2)}
.chip.phase-Mock,.chip.phase-EXAM{background:var(--law-soft);color:var(--law)}
.chip.phase-Revision{background:var(--acc-soft);color:var(--acc)}
.chip.phase-Final{background:var(--pill-grad);color:#241A05}
.linkbtn{border:none;background:none;color:var(--brand);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

.daygrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.daygrid aside.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - env(safe-area-inset-top,0px) - 88px);overflow-y:auto;scrollbar-width:none}
.daygrid aside.side::-webkit-scrollbar{display:none}
@media (max-width:900px){.daygrid{grid-template-columns:1fr}.daygrid aside.side{position:static;max-height:none}}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.block-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.block-h h3{font-size:16.5px}
.block-h .hrs{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.sw{width:10px;height:28px;border-radius:4px;flex:none}
.s-AA,.s-Acc{--c:var(--s1);--cs:var(--s1s)} .s-Law{--c:var(--s2);--cs:var(--s2s)} .s-QA{--c:var(--s3);--cs:var(--s3s)} .s-Eco{--c:var(--s5);--cs:var(--s5s)} .s-LAW{--c:var(--s2);--cs:var(--s2s)} .s-IT,.s-TAX{--c:var(--s3);--cs:var(--s3s)} .s-GST{--c:var(--s4);--cs:var(--s4s)} .s-CMA{--c:var(--s5);--cs:var(--s5s)} .s-AUD{--c:var(--s6);--cs:var(--s6s)} .s-FM,.s-FMSM{--c:var(--s7);--cs:var(--s7s)} .s-SM{--c:var(--s8);--cs:var(--s8s)}
.s-Test,.s-Review,.s-All,.s-Rest,.s-Recap{--c:var(--gold);--cs:var(--gold-soft)}
.sw{background:var(--c)}
.task{display:flex;gap:12px;padding:11px 16px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer;transition:background .15s;position:relative}
.task:first-of-type{border-top:none}
.task:hover{background:color-mix(in srgb,var(--cs) 55%,transparent)}
.task-postpone{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:var(--surface-2);color:var(--ink-2);border-radius:7px;width:26px;height:26px;font-size:16px;line-height:1;cursor:pointer;display:none;place-items:center;z-index:2;opacity:.7}
.task-postpone:hover{opacity:1;background:var(--warn);color:#fff}
.task:hover .task-postpone{display:grid}
.task input{position:absolute;opacity:0;pointer-events:none}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--c);flex:none;margin-top:1px;display:grid;place-items:center;transition:background .15s,transform .15s}
.box svg{width:14px;height:14px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.task.on .box{background:var(--c);transform:scale(1.05)}
.task.on .box svg{opacity:1}
.task.on .tt{color:var(--ink-2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-2) 60%,transparent)}
.task.future{cursor:not-allowed;opacity:.45}
.task.future .box{background:var(--surface-2)!important;border-color:var(--line)!important}
.tk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:2px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:1px 6px;background:var(--cs);color:var(--c)}
.pr{font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:5px;padding:1px 6px}
.pr-HIGH{background:var(--law-soft);color:var(--law)} .pr-MEDIUM{background:var(--gold-soft);color:var(--warn)} .pr-LOW{background:var(--surface-2);color:var(--ink-2)}
.tt{font-size:15px}
.tt small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.th{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap;padding-left:8px}
.recapnote{font-size:13px;color:var(--ink-2)}

.side .panel{margin-bottom:14px}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:92px;height:92px;flex:none}
.ring .big{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.15}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 4px}
input[type=number],input[type=text],input[type=tel],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
.pips{display:flex;gap:6px}
.pips button{flex:1;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--ground);font-weight:700;font-size:13px}
.pips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn{border:none;background:var(--btn-grad);color:#fff;font-weight:700;border-radius:10px;padding:9px 14px}
.btn.ghost{background:var(--btn2-bg);color:var(--brand)}
.btn.gold{background:var(--gold);color:#241A05}

/* calendar */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:12px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.month h3{font-size:16px;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--ink-2);text-align:center;font-weight:600}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12px;display:grid;place-items:center;position:relative;padding:0}
.cell.off{visibility:hidden}
.cell.today{outline:2px solid var(--gold);outline-offset:1px}
.cell.sel{border-color:var(--ink)}
.cell .dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%}
.cell.exam{background:var(--law);color:#fff;border-color:var(--law);font-weight:700}
.cell.mock{background:color-mix(in srgb,var(--law) 14%,var(--surface));border-color:color-mix(in srgb,var(--law) 35%,var(--line))}
.cell.mock .dot{background:var(--law)}
.cell.sun .dot{background:var(--gold)}
.cell.rev{background:color-mix(in srgb,var(--acc) 12%,var(--surface));border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.cell.finalrev{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.phase-timeline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.phase-pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid transparent;white-space:nowrap}
.phase-pill.p1{background:color-mix(in srgb,var(--brand) 15%,var(--surface));border-color:color-mix(in srgb,var(--brand) 30%,var(--line));color:var(--brand)}
.phase-pill.mock{background:color-mix(in srgb,var(--law) 15%,var(--surface));border-color:color-mix(in srgb,var(--law) 30%,var(--line));color:var(--law)}
.phase-pill.rev{background:color-mix(in srgb,var(--acc) 15%,var(--surface));border-color:color-mix(in srgb,var(--acc) 30%,var(--line));color:var(--acc)}
.phase-pill.fr{background:var(--gold-soft);border-color:var(--gold);color:var(--warn)}
.phase-pill.exam{background:var(--law);color:#fff;border-color:var(--law)}

/* chapters */
.subjgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.subjcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.subjcard h3{font-size:15px}
.subjcard svg{width:62px;height:62px;flex:none}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-weight:700;background:var(--surface-2);position:sticky;top:0}
tr.subjrow td{background:var(--surface-2);font-family:var(--display);font-weight:700}
.pbar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;min-width:90px}
.pbar i{display:block;height:100%;background:var(--c)}
.tick{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:700}
.tick.y{background:var(--good);color:#fff}
.stars{display:flex;gap:2px}
.stars button{border:none;background:none;padding:2px;font-size:16px;color:var(--line);line-height:1}
.stars button.on{color:var(--gold)}
.weak{font-size:11px;font-weight:700;color:var(--bad)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.filters button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* scores */
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.mock h3{font-size:16px;margin-bottom:10px}
.srow{display:grid;grid-template-columns:1fr 84px 60px;gap:8px;align-items:center;margin-bottom:8px;font-size:14px}
.srow input{text-align:right;font-family:var(--mono)}
.verdict{font-size:13px;font-weight:600;margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-family:var(--mono);font-size:11px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2);font-family:var(--display);font-weight:800;font-size:18px}
.badge.got .medal{background:var(--gold);color:#241A05;box-shadow:0 0 0 4px var(--gold-soft)}
.badge:not(.got){opacity:.62}
.badge h3{font-size:14.5px}
.badge p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}

/* ---- Error log ---- */
.el-panel{background:color-mix(in srgb,var(--bad) 5%,var(--surface));border:2px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 8%,transparent)}
.el-panel-header{display:flex;align-items:center;gap:8px;padding:11px 14px 10px;background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--bad) 25%,var(--line))}
.el-panel-icon{font-size:16px;line-height:1}
.el-panel-label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);font-family:var(--display)}

.el-tabs{display:flex;gap:6px;padding:10px 12px 0;background:none;flex-wrap:wrap;border-bottom:none}
.el-tab{flex:none;border:1.5px solid var(--line);background:var(--ground);padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;border-radius:999px;transition:all .15s;white-space:nowrap}

.el-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:28px}

/* ---- Roadmap journey view ---- */
.rm-wrap{max-width:480px;margin:0 auto;padding-bottom:40px}
.rm-header{margin-bottom:20px}
.rm-track{position:relative;display:flex;flex-direction:column;align-items:center;gap:0}

.rm-node.locked .rm-bubble{opacity:.55}

.rm-node.exam.done .rm-bubble{border-color:var(--law);background:var(--law-soft,#f8e4dc)}
.rm-label{font-size:12px;font-weight:700;color:var(--ink-2);line-height:1.2;max-width:88px}

.rm-node.done .rm-label{color:var(--brand)}

.rm-connector{width:100%;position:relative;height:48px;flex:none}
.rm-connector svg{width:100%;height:100%;overflow:visible}

.rm-connector.exam-conn .rm-path-fill{stroke:var(--law)}
.rm-xp-badge{display:inline-flex;align-items:center;gap:4px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--warn);margin-top:3px}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" src="../assets/arivupro-icon.webp" alt="ArivuPro">
      <div><h1>Rank Road</h1><small id="hello"></small></div>
    </div>
    <div class="stat" title="Days in a row with 80%+ of the plan done">
      <svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z" fill="var(--gold)"/></svg>
      <b id="streak">0</b><span>day streak</span>
    </div>
    <div class="stat lvl" title="Earn XP by ticking off tasks">
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between;gap:8px"><b id="lvlname" style="font-family:var(--body);font-size:13px">Aspirant</b><span class="num" id="xp">0 XP</span></div>
        <div class="lvlbar"><i id="lvlbar" style="width:0%"></i></div>
      </div>
    </div>
    <div class="profslot" id="profslot"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="calendar" aria-selected="false">Calendar</button>
    <button role="tab" data-tab="chapters" aria-selected="false">Chapters</button>
    <button role="tab" data-tab="scores" aria-selected="false">Mocks & tests</button>
    <button role="tab" data-tab="badges" aria-selected="false">Badges</button>
    <button role="tab" data-tab="roadmap" aria-selected="false">Roadmap</button>
    <button role="tab" data-tab="plan" aria-selected="false">My plan</button>
  </nav>

  <main id="view"></main>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= Rank Road planning engine =================
   Builds the day-by-day plan in the browser from the syllabus + the student's own hours.
   buildPlan(SYL, settings, {from, remain, mocksDone}) -> {days, warnings, stats}          */
const ENGINE = (() => {
  const PHASE_NAME = {P1: "Phase 1 – Study (SM + PYQ)", R1: "Revision 1", R2: "Revision 2"};
  const q = x => Math.round(x * 4) / 4;
  const iso = d => d.toISOString().slice(0, 10);
  const addD = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
  const dow = s => new Date(s + "T00:00:00Z").getUTCDay();          // 0 = Sunday
  const range = (a, b) => { const out = []; for (let d = a; d <= b; d = addD(d, 1)) out.push(d); return out; };
  const PRIO_ORDER = {High: 0, Medium: 1, Low: 2};
  const SR = "↳ Last 15 min = SESSION RECAP: close the book, write this session's key points / formats / formulas / sections on the chapter's one-page summary sheet + 5 flashcards";

  function hoursFor(settings, d) {
    if (settings.holidays && settings.holidays.includes(d)) return 0;
    const keys = Object.keys(settings.hours).sort();
    let key = d.slice(0, 7);
    if (!settings.hours[key]) key = key < keys[0] ? keys[0] : keys[keys.length - 1];
    const row = settings.hours[key] || [0, 0, 0];
    const w = dow(d);
    let h = w === 0 ? row[2] : w === 6 ? row[1] : row[0];
    if (settings.coaching && settings.coaching.enabled && settings.coaching.days && settings.coaching.days.includes(w)) {
      h = Math.max(0, h - (settings.coaching.hours || 0));
    }
    return Math.max(0, Math.min(14, +h || 0));
  }
  const recapFor = (avail, sunday) => avail <= 0 ? 0 : sunday ? Math.min(0.5, avail) : avail >= 6 ? 0.75 : avail >= 3 ? 0.5 : 0.25;

  /* ---- units per phase, scaled by what is still left (remain) ---- */
  function units(SYL, cfg, phase, remain, subjWeights, chWeights) {
    const out = {};
    for (const s of cfg.subjects) {
      let chs = SYL[s];
      if (phase === "R2") chs = [...chs].sort((a, b) => PRIO_ORDER[a.pr] - PRIO_ORDER[b.pr]);
      const lst = [];
      const sw = subjWeights?.[s] ?? 1;
      for (const c of chs) {
        const key = `${s} Ch ${c.no}:`;
        const nm = `${c.n} [${c.pr.toUpperCase()}]`;
        const tot = c.u.reduce((a, x) => a + x[1], 0);
        const cw = chWeights?.[s+"-"+c.no] ?? 1;
        const push = (label, hrs) => {
          const uid = phase + "|" + label;
          const f = remain[uid] ?? 1;
          if (f > 0.05) lst.push({label, hours: hrs * sw * cw * f, key, uid});
        };
        if (phase === "P1") c.u.forEach(([u, h]) => push(`${key} ${nm} — ${u}`, h));
        else if (phase === "R1") push(`${key} ${nm} — ${cfg.r1}`, Math.max(1, Math.round(tot * .42 * 2) / 2));
        else push(`${key} ${nm} — ${cfg.r2}`, Math.max(1, Math.round(tot * .30 * 2) / 2));
      }
      out[s] = lst;
    }
    return out;
  }
  const need = U => Object.values(U).reduce((a, l) => a + l.reduce((b, u) => b + u.hours, 0), 0);

  /* ---- fill a list of days with two subjects so both finish together (port of the Python engine) ---- */
  function allocBlock(U, days, subs) {
    const plan = {};
    subs = subs.filter(s => U[s] && U[s].length);
    if (!subs.length || !days.length) return plan;
    const avail = days.reduce((a, x) => a + x[1], 0);
    const tot = subs.reduce((a, s) => a + U[s].reduce((b, u) => b + u.hours, 0), 0);
    const sc = avail * 0.965 / tot;
    for (const s of subs) for (const u of U[s]) { u.rem = Math.max(.25, q(u.hours * sc)); u.full = u.rem; }
    const ptr = Object.fromEntries(subs.map(s => [s, 0]));
    const rem = Object.fromEntries(subs.map(s => [s, U[s].reduce((b, u) => b + u.rem, 0)]));
    const last = {};
    days.forEach(([d, hrs], i) => {
      const left = days.length - i;
      let split;
      const act = subs.filter(s => rem[s] > .01);
      if (act.length <= 1) split = [[act[0] || subs[0], hrs]];
      else if (act.length === 2) {
        const [a, b] = act, fa = rem[a] / left, fb = rem[b] / left;
        let x = q(hrs * fa / (fa + fb));
        if (hrs >= 1) x = Math.min(Math.max(x, .5), hrs - .5);
        split = [[a, x], [b, hrs - x]];
      } else {                                   // squeezed window: several subjects share the day
        const fit = Math.max(2, Math.floor(hrs / .75));
        const pick = [...act].sort((m, n) => rem[n] - rem[m]).slice(0, fit);
        const tot = pick.reduce((z, s) => z + rem[s], 0);
        split = pick.map(s => [s, Math.max(.25, q(hrs * rem[s] / tot))]);
        const diff = hrs - split.reduce((z, x) => z + x[1], 0);
        split.sort((m, n) => n[1] - m[1]); split[0][1] = Math.max(.25, split[0][1] + diff);
      }
      const ss = [];
      for (const [s, h] of split) {
        if (h <= 0) continue;
        const items = []; let lf = h;
        while (lf > .01 && ptr[s] < U[s].length) {
          const u = U[s][ptr[s]], take = Math.min(u.rem, lf);
          u.rem -= take; lf -= take; rem[s] -= take;
          let tag = "";
          if (u.rem > .01) tag = Math.abs(take + u.rem - u.full) < .01 ? " (start)" : " (contd.)";
          else if (Math.abs(take - u.full) > .01) tag = " (finish)";
          items.push({t: u.label + tag, k: u.key.replace(" Ch ", "-").replace(":", ""), h: q(take), uid: u.uid, key: u.key});
          if (u.rem <= .01) ptr[s]++;
        }
        if (lf > .01) items.push({t: `${s}: buffer – Error-Log review / MCQ drill / pending topics`, k: null, h: q(lf)});
        items.push({t: SR, k: null, h: null});
        ss.push({s, h: q(h), items});
        last[s] = d;
      }
      plan[d] = ss;
    });
    for (const s of subs) while (ptr[s] < U[s].length) {           // carry-over safety net
      const u = U[s][ptr[s]++], ld = last[s] || days[days.length - 1][0];
      let sess = (plan[ld] = plan[ld] || []).find(x => x.s === s);
      if (!sess) { sess = {s, h: 0, items: [{t: SR, k: null, h: null}]}; plan[ld].push(sess); }
      sess.items.splice(sess.items.length - 1, 0, {t: u.label + " (carry-over – use buffer time)", k: u.key.replace(" Ch ", "-").replace(":", ""), h: q(u.rem), uid: u.uid, key: u.key});
    }
    return plan;
  }
  function allocate(U, days, blocks) {
    let live = blocks.map(b => b.filter(s => U[s] && U[s].length)).filter(b => b.length);
    if (live.length > 1 && days.length < live.length * 3) live = [live.flat()];   // too few days: revise all papers side by side
    const needs = live.map(b => b.reduce((a, s) => a + U[s].reduce((x, u) => x + u.hours, 0), 0));
    const tot = days.reduce((a, x) => a + x[1], 0), sumN = needs.reduce((a, b) => a + b, 0) || 1;
    const plan = {}; let start = 0, cum = 0, target = 0;
    live.forEach((b, bi) => {
      target += tot * needs[bi] / sumN;
      let end;
      if (bi === live.length - 1) end = days.length;
      else { end = start; while (end < days.length && cum + days[end][1] <= target + days[end][1] / 2) { cum += days[end][1]; end++; } end = Math.max(end, Math.min(start + 1, days.length)); }
      Object.assign(plan, allocBlock(U, days.slice(start, end), b)); start = end;
    });
    return plan;
  }

  const monthsBetween = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
  function attemptOf(cfg, id) { return cfg.attempts.find(a => a.id === id) || cfg.attempts[0]; }
  function papersOf(cfg, att) { return cfg.papers.map(p => ({...p, date: att.dates[p.code]})).sort((a, b) => a.date < b.date ? -1 : 1); }
  /* hours per month from a preset's tiers ("1" = month before the first paper, and the exam month) */
  function hoursFromTiers(tiers, start, att) {
    const first = Object.values(att.dates).sort()[0], out = {};
    for (let m = start.slice(0, 7); m <= first.slice(0, 7); m = addD(m + "-01", 32).slice(0, 7)) {
      const k = Math.max(1, monthsBetween(m, first.slice(0, 7)));
      out[m] = [...(tiers[k <= 3 ? String(k) : "far"])];
    }
    return out;
  }
  function sylFor(syl, att) {
    if (!att.relabel) return syl;
    const out = JSON.parse(JSON.stringify(syl));
    for (const [key, units] of Object.entries(att.relabel)) {
      const [s, no] = key.split("-"); const ch = (out[s] || []).find(c => c.no === +no);
      if (ch) ch.u = units.concat(ch.u.filter(u => /^PYQ/.test(u[0])));
    }
    return out;
  }
  /* final-revision days worked out from the exam dates */
  function finalsFor(cfg, papers) {
    const f = {}, exams = new Set(papers.map(p => p.date));
    const dayBefore = (p, first) => [[p.code, 9, cfg.dayBefore[p.code][0]], ["Rest", 3, cfg.dayBefore[p.code][1]]];
    for (let i = 1; i < papers.length; i++) {
      const gap = range(addD(papers[i - 1].date, 1), addD(papers[i].date, -1)).filter(d => !exams.has(d));
      gap.forEach((d, j) => f[d] = j === gap.length - 1 ? dayBefore(papers[i])
        : [[papers[i].code, 6, `FINAL REVISION – ${papers[i].name}: full revision from one-page summaries; 1 timed full paper`], [papers[i].code, 6, "Error Log + weak chapters (from your confidence ratings) of the next paper"]]);
    }
    const eve = addD(papers[0].date, -1); f[eve] = dayBefore(papers[0]);
    cfg.finalPre.forEach((tpl, i) => { f[addD(eve, -(cfg.finalPre.length - i))] = tpl; });
    return f;
  }

  function buildPlan(SYL, settings, opts = {}) {
    const cfg = SYL.cfg, warnings = [];
    const att = attemptOf(cfg, settings.attempt), syl = sylFor(SYL.syl, att);
    const PAP = papersOf(cfg, att);
    const remain = opts.remain || {}, mocksDone = opts.mocksDone || 0;
    const from = opts.from || settings.start;
    const exams = Object.fromEntries(PAP.map(p => [p.date, p]));
    const paper = Object.fromEntries(PAP.map(p => [p.code, p]));
    const lastExam = PAP.at(-1).date;
    const finals = finalsFor(cfg, PAP);
    const tailStart = Object.keys(finals).concat(Object.keys(exams)).sort()[0];
    const bodyEnd = addD(tailStart, -1);
    const body = from <= bodyEnd ? range(from, bodyEnd) : [];
    const avail = Object.fromEntries(range(from < tailStart ? from : tailStart, lastExam).map(d => [d, hoursFor(settings, d)]));

    /* phase workloads still to do */
    const U = {P1: units(syl, cfg, "P1", remain, settings.subjWeights, settings.chWeights), R1: units(syl, cfg, "R1", remain, settings.subjWeights, settings.chWeights), R2: units(syl, cfg, "R2", remain, settings.subjWeights, settings.chWeights)};
    const W = {P1: need(U.P1), R1: need(U.R1), R2: need(U.R2)};
    const Wt = W.P1 + W.R1 + W.R2 || 1;

    /* ---- place mocks: cycle n goes after phase n (P1, R1, R2) ---- */
    const cycles = cfg.mockCycles.map((c, i) => ({n: i + 1, days: c})).slice(mocksDone);
    const needFor = grp => grp.reduce((a, p) => a + paper[p].dur, 0) + 1.5 * grp.length;
    const isTest = d => dow(d) === 0 && avail[d] >= 2;
    const cap = d => Math.max(0, avail[d] - recapFor(avail[d], dow(d) === 0) - (isTest(d) ? Math.min(avail[d] - .5, 4.5) : 0));
    const mockOf = {};
    // last cycle backwards from the end of the body
    const lastCycle = cycles.length && cycles.at(-1).n === 3 ? cycles.at(-1) : null;
    if (lastCycle) {
      const picks = []; let gi = lastCycle.days.length - 1;
      for (let i = body.length - 1; i >= 0 && gi >= 0; i--) if (avail[body[i]] >= needFor(lastCycle.days[gi])) { picks.unshift([body[i], lastCycle.days[gi]]); gi--; }
      if (gi >= 0) warnings.push(`Mock ${lastCycle.n} could not be fitted: it needs days with at least ${needFor(lastCycle.days[0])} free hours before ${tailStart}.`);
      else picks.forEach(([d, g], j) => mockOf[d] = {n: lastCycle.n, grp: g, idx: j, len: picks.length});
    }
    const early = cycles.filter(c => c !== lastCycle);
    const phases = ["P1", "R1", "R2"];
    const studyCap = body.filter(d => !mockOf[d]).reduce((a, d) => a + cap(d), 0)
      - early.reduce((a, c) => {
          const fits = body.filter(d => !mockOf[d] && avail[d] >= needFor(c.days[0])).length >= c.days.length * 2;
          return a + (fits ? c.days.reduce((x, g) => x + Math.max(0, needFor(g) - recapFor(needFor(g), false)), 0) : 0);
        }, 0);
    const bounds = [W.P1 / Wt * studyCap, (W.P1 + W.R1) / Wt * studyCap];
    const phaseOf = {}; let cum = 0, ph = 0, pending = null;
    const boundaryCycle = {0: early.find(c => c.n === 1), 1: early.find(c => c.n === 2)};
    for (const d of body) {
      if (mockOf[d]) { phaseOf[d] = "R2"; continue; }
      if (pending && pending.gi < pending.c.days.length && avail[d] >= needFor(pending.c.days[pending.gi])) {
        mockOf[d] = {n: pending.c.n, grp: pending.c.days[pending.gi], idx: pending.gi, len: pending.c.days.length};
        pending.gi++; phaseOf[d] = phases[ph]; if (pending.gi >= pending.c.days.length) pending = null; continue;
      }
      while (ph < 2 && cum >= bounds[ph]) {
        if (pending) warnings.push(`Mock ${pending.c.n} could not be completed before the next phase — add a few days with ${needFor(pending.c.days[0])}+ free hours.`);
        pending = null;
        if (boundaryCycle[ph]) { pending = {c: boundaryCycle[ph], gi: 0}; boundaryCycle[ph] = null; }
        ph++;
      }
      if (pending && pending.gi === 0 && avail[d] >= needFor(pending.c.days[0])) {
        mockOf[d] = {n: pending.c.n, grp: pending.c.days[0], idx: 0, len: pending.c.days.length};
        pending.gi = 1; phaseOf[d] = phases[ph]; if (pending.gi >= pending.c.days.length) pending = null; continue;
      }
      phaseOf[d] = phases[ph]; cum += cap(d);
    }
    Object.values(boundaryCycle).forEach(c => c && warnings.push(`Mock ${c.n} could not be fitted — not enough days with ${needFor(c.days[0])}+ free hours.`));
    if (pending) warnings.push(`Mock ${pending.c.n} is only partly scheduled — add hours on a few days so each paper gets ${needFor(pending.c.days[0])} free hours.`);

    /* ---- allocate study time phase by phase ---- */
    const plans = {};
    for (const p of phases) {
      const days = body.filter(d => phaseOf[d] === p && !mockOf[d] && cap(d) > 0.2).map(d => [d, q(cap(d))]);
      if (W[p] > 0 && !days.length) warnings.push(`No time left for ${PHASE_NAME[p]} — ${p === "P1" ? "first reading will not be finished" : "this revision is skipped"}. Add hours or start earlier.`);
      plans[p] = allocate(U[p], days, cfg.blocks);
    }
    const studyHours = phases.reduce((a, p) => a + Object.values(plans[p]).reduce((x, ss) => x + ss.reduce((y, s) => y + s.h, 0), 0), 0);

    /* ---- build the day objects ---- */
    const out = [];
    const all = range(from < tailStart ? from : tailStart, lastExam).filter(d => d >= from);
    for (const d of all) {
      const a = avail[d], sun = dow(d) === 0;
      let p = exams[d] ? "EXAM DAY" : finals[d] ? "Final Revision" : mockOf[d] ? `Mock Exam ${mockOf[d].n}` : PHASE_NAME[phaseOf[d]] || "Final Revision";
      let rh = exams[d] ? 0 : recapFor(a, sun), sess = [], keys = [];
      const pl = plans[phaseOf[d]] || {};
      if (exams[d]) {
        const pp = exams[d];
        sess.push({s: pp.code, h: 3, items: [{t: `EXAM – ${pp.name} (${pp.time}). Morning: 1.5 h light skim of summary sheets only; reach the centre by 1:00 pm`}]});
        const ev = cfg.examEvening[pp.code];
        sess.push(ev ? {s: "All", h: 1.5, items: [{t: ev}]} : {s: "Rest", h: 0, items: [{t: "No study after the paper. Do not discuss answers. Light look at the next paper only if fresh (max 1 h)"}]});
      } else if (finals[d]) {
        const [x, y] = finals[d], T = x[1] + y[1], f = Math.min(1, Math.max(a, 4) / T);
        if (a < 4 && !warnings.some(w => w.startsWith("Final"))) warnings.push("Final-revision days are planned at a minimum of 4 hours — try to keep the last days before your papers free.");
        rh = recapFor(Math.max(a, 4), false);
        sess.push({s: x[0], h: q(x[1] * f), items: [{t: x[2]}]});
        sess.push({s: y[0], h: Math.max(0, q(y[1] * f - rh)), items: [{t: y[2]}]});
      } else if (mockOf[d]) {
        const {n, grp, idx, len} = mockOf[d], src = {1: "ICAI MTP Series 1 (or a full-syllabus test paper)", 2: "ICAI MTP Series 2", 3: "Latest ICAI question paper / RTP-based full test"}[n];
        const free = a - rh;
        if (grp.length === 1) {
          const pp = paper[grp[0]], ev = Math.min(2, Math.max(1, free - pp.dur));
          sess.push({s: pp.code, h: q(pp.dur + ev), items: [{t: `MOCK ${n} – ${pp.name} (${pp.time})`, sub: `Sit at the real exam time, exam conditions. Source: ${src}. Then ${ev} h: mark strictly against ICAI answers, fill the Mock Tracker, log every lost mark in the Error Log`}]});
          const rest = q(free - pp.dur - ev);
          if (rest >= .5) {
            const nextCycleDay = Object.entries(mockOf).find(([dd, m]) => m.n === n && m.idx === idx + 1);
            const nx = nextCycleDay ? paper[nextCycleDay[1].grp[0]] : null;
            sess.push({s: nx ? nx.code : "All", h: rest, items: [{t: nx ? `Morning: revise ${nx.name} for the next mock (summary sheets + Error Log)` : `Fix the weakest 3 topics found across Mock ${n} – re-solve, re-read`}]});
          }
        } else {
          const [A, B] = grp.map(g => paper[g]), h1 = q(free / 2);
          sess.push({s: A.code, h: h1, items: [{t: `MOCK ${n} (morning, 9:45 am reading, 10:00 am–1:00 pm) – ${A.name}`, sub: `Source: ${src}. Evaluate it tonight`}]});
          sess.push({s: B.code, h: q(free - h1), items: [{t: `MOCK ${n} (real exam slot, 1:45 pm reading, 2:00–5:00 pm) – ${B.name}`, sub: "Evaluate tonight; log every lost mark in the Error Log"}]});
        }
      } else if (a <= 0) {
        rh = 0;
        sess.push({s: "Rest", h: 0, items: [{t: "Rest day — nothing planned. Rest is part of the plan."}]});
      } else {
        if (isTest(d)) {
          const prev = []; for (let k = 6; k >= 1; k--) (pl[addD(d, -k)] || []).forEach(s => s.items.forEach(it => it.key && !prev.includes(it.key) && prev.push(it.key)));
          const kt = prev.map(x => x.replace(":", "")).join(", ") || "chapters of this week";
          const budget = Math.min(a - rh, 4.5), th = Math.min(3, q(budget * .55));
          const r1 = phaseOf[d] !== "P1";
          sess.push({s: "Test", h: th, items: [{t: `${r1 ? "WEEKLY REVISION TEST (timed)" : "WEEKLY TEST (timed, closed book)"}: ${kt}`, sub: r1 ? "Use ICAI RTP / MTP questions of these chapters" : cfg.testDesc}]});
          sess.push({s: "Review", h: q(budget - th), items: [{t: "Evaluate against ICAI answers → Error Log → clear the week's backlog", sub: "WEEKLY RECAP (last 45 min): read the one-page summary sheet of every chapter covered Mon–Sat, re-solve this week's Error Log items, 15 min plan for next week"}]});
        }
        (pl[d] || []).forEach(s => { sess.push(s); s.items.forEach(it => it.key && keys.push(it.key)); });
      }
      const h = rh + sess.reduce((x, s) => x + s.h, 0);
      out.push({d, p, h: q(h), rh, sess, keys});
    }
    /* morning recap text */
    const CHN = {}; for (const s of cfg.subjects) for (const c of syl[s]) CHN[`${s} Ch ${c.no}:`] = `${s} Ch ${c.no} ${c.n}`;
    out.forEach((x, i) => {
      if (!x.rh) { x.recap = ""; return; }
      if (i === 0 && !opts.prevKeys) { x.recap = "First day – no recap. Use this time to set up: Error Log notebook, one-page summary-sheet folder (one page per chapter), flashcard box"; return; }
      const pv = i ? out[i - 1] : {keys: opts.prevKeys || [], p: "", sess: []};
      const pk = [...new Set(pv.keys)];
      if (pk.length) x.recap = "MORNING RECAP (active recall, closed book) of yesterday: " + pk.map(k => CHN[k]).join("; ") + " → write the key points from memory, then check against the summary sheet; re-do 2 flashcards you got wrong";
      else if (pv.p.startsWith("Mock")) x.recap = "MORNING RECAP: re-read yesterday's mock Error Log entries; 15 min formats sheet of today's paper";
      else if (pv.sess.some(s => s.s === "Test")) x.recap = "MORNING RECAP: Sunday test corrections + last week's Error Log items (closed book, then check)";
      else x.recap = "MORNING RECAP: yesterday's summary sheets + Error Log (closed book, then check)";
    });
    const mockDates = {};
    Object.entries(mockOf).forEach(([d, m]) => (mockDates[m.n] = mockDates[m.n] || []).push(d));
    Object.values(mockDates).forEach(l => l.sort());
    const phaseRange = {};
    for (const x of out) { const k = x.p; if (!phaseRange[k]) phaseRange[k] = [x.d, x.d]; else phaseRange[k][1] = x.d; }
    return {days: out, warnings, stats: {studyHours, totalHours: out.reduce((a, x) => a + x.h, 0), mockDates, phaseRange, work: W}};
  }
  return {buildPlan, hoursFor, addD, dow, attemptOf, papersOf, hoursFromTiers, finalsFor, monthsBetween};
})();

function surfacedErrors(date){ const keys=chaptersOnDay(date); if(!S.errs||!keys.length) return []; return keys.flatMap(k=>(S.errs[k]||[]).map((e,i)=>({...e,k,i}))); }
function chapterHasErrs(k){ return !!(S.errs&&((S.errs[k]&&S.errs[k].length)||(S.errs[k+"__notes"]))); }
function chapterName(k){ const c=CHAPTERS.find(c=>c.k===k); return c?c.n:k; }

/* ---------- XP, streak ---------- */
function taskXP(t){ if(t.recap) return 15; if(t.h) return Math.round(t.h*20); if(/SESSION RECAP/.test(t.t)) return 8; return 30; }
function totalXP(){
  let xp=0;
  for(const d of DAYS){ const ts=TASKS[d.d]; for(const t of ts) if(isDone(d.d,t.id)) xp+=taskXP(t); if(ts.length && dayPct(d.d)===1) xp+=40; }
  xp += Object.values(S.scores).filter(v=>v!=="" && v!=null).length*25;
  xp += Object.values(S.tests).filter(v=>v!=="" && v!=null).length*30;
  return xp;
}
function level(xp){ let i=0; for(let j=0;j<LEVELS.length;j++) if(xp>=LEVELS[j][0]) i=j; const cur=LEVELS[i], nxt=LEVELS[i+1]; return {name:cur[1], pct: nxt? (xp-cur[0])/(nxt[0]-cur[0]) : 1, next: nxt? nxt[0]-xp : 0, nextName: nxt?nxt[1]:null}; }
function streak(){
  const upto = TODAY<DAYS[0].d ? null : (TODAY>DAYS.at(-1).d ? DAYS.at(-1).d : TODAY);
  if(!upto) return 0;
  let i=IDX[upto], n=0;
  if(TASKS[DAYS[i].d].length && dayPct(DAYS[i].d)<0.8) i--;
  for(;i>=0;i--){ const d=DAYS[i].d; if(!TASKS[d].length) continue; if(dayPct(d)>=0.8) n++; else break; }
  return n;
}
function bestStreak(){ let b=0,c=0; for(const d of DAYS){ if(!TASKS[d.d].length) continue; if(dayPct(d.d)>=0.8){c++;b=Math.max(b,c);} else c=0; } return b; }

/* ---------- chapter progress ---------- */
function chapterStats(){
  const st={};
  for(const c of CHAPTERS) st[c.k]={p1:[0,0],r1:[0,0],r2:[0,0]};
  for(const d of DAYS){
    const ph = d.p.startsWith("Phase 1")?"p1": d.p==="Revision 1"?"r1": d.p==="Revision 2"?"r2":null;
    if(!ph) continue;
    for(const t of TASKS[d.d]) if(t.k && st[t.k]){ st[t.k][ph][1]++; if(isDone(d.d,t.id)) st[t.k][ph][0]++; }
  }
  return st;
}

/* ---------- badges ---------- */
function mockAgg(n){ const v=PCODES.map(s=>S.scores[SK(n,s)]); return v.every(x=>x!==""&&x!=null&&!isNaN(x))? v.reduce((a,b)=>a+ +b,0):null; }
function badgeList(){
  const cs=chapterStats(); const bs=bestStreak();
  const phaseDone=(subjs,ph)=>CHAPTERS.filter(c=>subjs.includes(c.s)).every(c=>cs[c.k][ph][1]>0 && cs[c.k][ph][0]===cs[c.k][ph][1]);
  const anyDay = DAYS.some(d=>dayPct(d.d)===1);
  return [
    ["1","First step","Finish every task on any one day",anyDay],
    ["3","Hat-trick","3-day streak",bs>=3],
    ["7","Week warrior","7-day streak",bs>=7],
    ["21","Habit formed","21-day streak",bs>=21],
    ["50","Unbreakable","50-day streak",bs>=50],
    ...CFG.blocks.map(b=>[b.map(x=>x[0]).join(""), b.map(x=>NAMES[x].split(" ")[0]).join(" + ")+" done", "Phase 1 study complete in "+b.map(x=>NAMES[x]).join(" and "), phaseDone(b,"p1")]),
    ...CFG.special.map(([mk,nm,ds,key])=>[mk,nm,ds,(cs[key]&&cs[key].p1[1]>0&&cs[key].p1[0]===cs[key].p1[1])]),
    ["R1","First pass","Revision 1 complete in every paper",phaseDone(SUBS,"r1")],
    ["R2","Second pass","Revision 2 complete in every paper",phaseDone(SUBS,"r2")],
    ["M1","Mock 1 logged","All Mock 1 scores entered",mockAgg(1)!=null],
    ["M2","Mock 2 logged","All Mock 2 scores entered",mockAgg(2)!=null],
    ["M3","Dress rehearsal","All Mock 3 scores entered",mockAgg(3)!=null],
    [String(BENCH),"Target zone",BENCH+"%+ aggregate in any mock",[1,2,3].some(n=>(mockAgg(n)||0)>=BENCH*PCODES.length)],
    ...(CFG.exemption?[["60","Exemption proof","60+ in every paper of one mock",[1,2,3].some(n=>PCODES.every(p=>+(S.scores[SK(n,p)]??-1)>=60))]]:[]),
    ["↑","Climber","Each mock aggregate beats the one before",mockAgg(1)!=null&&mockAgg(2)!=null&&mockAgg(3)!=null&&mockAgg(2)>mockAgg(1)&&mockAgg(3)>mockAgg(2)],
    ["XP","Distinction Holder","Reach the top level",totalXP()>=LEVELS.at(-1)[0]],
  ];
}

function ringSVG(p,color,size=92,stroke=10,label=""){

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(){
  if(reduce) return;
  const cv=$("#fx"), ctx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#D9981E","#2E7153","#A34A2E","#2F5D8A","#6B4A86","#8FB29C"];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:Math.random()*6+4,c:cols[Math.random()*cols.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0; (function tick(){ ctx.clearRect(0,0,cv.width,cv.height); for(const p of ps){ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); } if(++f<110) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

function toggleTask(date,id){
  if(date>TODAY && !isDone(date,id)){
    // show motivation popup for future days, then tick on confirm
    const existing=document.querySelector(".pp-sheet"); if(existing) existing.remove();
    const dayLabel=new Date(date+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
    const msg=AHEAD_MSGS[Math.floor(Math.random()*AHEAD_MSGS.length)];
    const el=document.createElement("div"); el.className="pp-sheet";
    el.innerHTML=`<div class="pp-backdrop"></div><div class="pp-box">
      <h3 style="font-size:19px;margin-bottom:8px">${msg}</h3>
      <p>This is <b>${esc(dayLabel)}</b>'s plan. You're studying ahead — that's impressive. Ready to tick this off?</p>
      <div class="pp-actions">
        <button class="pp-confirm" id="pp-yes" style="background:var(--brand)">Yes, I studied this ✓</button>
        <button class="pp-cancel" id="pp-no">Not yet</button>
      </div>
    </div>`;
    document.body.appendChild(el);
    el.querySelector(".pp-backdrop").onclick=()=>el.remove();
    el.querySelector("#pp-no").onclick=()=>el.remove();
    el.querySelector("#pp-yes").onclick=()=>{
      el.remove();
      const before=dayPct(date);
      const d=S.days[date]=S.days[date]||{}; d.t=d.t||{}; d.t[id]=1;
      save();
      const after=dayPct(date);
      if(after===1&&before<1){ burst(); toast("Day complete — +40 XP bonus"); }
      renderToday(); refreshHeader();
    };
    return;
  }
  const before=dayPct(date);
  const d=S.days[date]=S.days[date]||{}; d.t=d.t||{};
  if(d.t[id]) delete d.t[id]; else d.t[id]=1;
  save();
  const after=dayPct(date);
  if(after===1 && before<1){ burst(); toast("Day complete — +40 XP bonus"); }
  else if(after>=.8 && before<.8) toast("80% done — streak secured");
  renderToday(); refreshHeader();
}

function postponeChapter(uid, chKey, chName){
  if(!S.plan){ toast("No active plan — set up a plan first"); return; }
  // compute fresh remain from current progress, then force this uid back to 1 (fully unfinished)
  const o = replanOpts(TODAY);
  o.remain[uid] = 1;
  // delete any ticks for today's tasks that belong to this uid
  const todayData = S.days[TODAY]; if(todayData && todayData.t){
    for(const t of (TASKS[TODAY]||[])) if(t.uid===uid) delete todayData.t[t.id];
  }
  S.plan = {settings: S.plan.settings, from: o.from, remain: o.remain, mocksDone: o.mocksDone, frozen: o.frozen, attemptFrom: S.plan.attemptFrom};
  save(); flush(); regen();
  selDay = defaultDay(); refreshHeader(); renderToday();
  toast("📅 "+chName.replace(/ — .*$/,"")+" moved to next available slot");
}

function renderCalendar(){
  const months=[]; for(let m=DAYS[0].d.slice(0,7); m<=DAYS.at(-1).d.slice(0,7); m=ENGINE.addD(m+"-01",32).slice(0,7)) months.push([m, new Date(m+"-01T00:00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"})]);
  const colorFor=p=> p===0?"var(--surface)":`color-mix(in srgb,var(--brand) ${Math.round(18+p*72)}%,var(--surface))`;
  const done=DAYS.filter(d=>dayPct(d.d)>=.8).length, past=DAYS.filter(d=>d.d<=TODAY).length;
  const fdS=iso=>fmt(iso,{day:"numeric",month:"short"});

  // Build phase timeline pills
  const phaseRange=PLANINFO.stats&&PLANINFO.stats.phaseRange||{};
  const phaseOrder=["Phase 1","Revision 1","Revision 2","Final Revision","EXAM DAY"];
  const pillClass=p=>p.startsWith("Phase 1")?"p1":p.startsWith("Mock")?"mock":p.startsWith("Revision")?"rev":p.startsWith("Final")?"fr":p==="EXAM DAY"?"exam":"p1";
  // Collect all phases sorted by start date
  const allPhases=Object.entries(phaseRange).sort((a,b)=>a[1][0]<b[1][0]?-1:1);
  const timelinePills=allPhases.map(([name,[start,end]])=>{
    const label=name.replace("Phase 1 – Study (SM + PYQ)","Phase 1").replace("Mock Exam ","Mock ").replace("Final Revision","Final Rev");
    return `<span class="phase-pill ${pillClass(name)}" title="${esc(name)}: ${fdS(start)} – ${fdS(end)}">${esc(label)} <span style="opacity:.7;font-weight:400">${fdS(start)}–${fdS(end)}</span></span>`;
  }).join("");

  let html=`<div class="sectionhead"><h2>Consistency map</h2><span class="muted">${done} of ${past||0} days so far at 80%+ · best streak <b class="num">${bestStreak()}</b></span></div>
  <div class="phase-timeline">${timelinePills}</div>
  <div class="legend"><span><i style="background:var(--surface);border:1px solid var(--line)"></i>Study</span><span><i style="background:color-mix(in srgb,var(--acc) 25%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line))"></i>Revision</span><span><i style="background:color-mix(in srgb,var(--law) 25%,var(--surface));border:1px solid color-mix(in srgb,var(--law) 40%,var(--line))"></i>Mock</span><span><i style="background:var(--law)"></i>Exam</span><span><i style="background:var(--gold-soft);border:1px solid var(--gold)"></i>Holiday</span></div><div class="months">`;

  for(const [ym,label] of months){
    const first=new Date(ym+"-01T00:00:00"); const dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
    const off=(first.getDay()+6)%7;
    html+=`<div class="panel month"><h3>${label}</h3><div class="cal">${["M","T","W","T","F","S","S"].map(x=>`<span class="dow">${x}</span>`).join("")}${"<span class='cell off'></span>".repeat(off)}`;
    for(let n=1;n<=dim;n++){
      const iso=ym+"-"+String(n).padStart(2,"0"); const d=DAYS[IDX[iso]];
      if(!d){ html+=`<span class="cell" style="opacity:.35">${n}</span>`; continue; }
      const p=dayPct(iso), exam=d.p==="EXAM DAY", mock=d.p.startsWith("Mock"), sun=d.sess.some(s=>s.s==="Test");
      const rev=!exam&&!mock&&(d.p==="Revision 1"||d.p==="Revision 2");
      const finalrev=!exam&&!mock&&d.p==="Final Revision";
      const hol=!exam&&!mock&&d.h===0&&(currentSettings().holidays||[]).includes(iso);
      // For study/revision/finalrev days use completion colour; mock and exam use phase colour
      const bgStyle=exam||hol?"":mock?"":(rev||finalrev)?`background:${colorFor(p)};${p>.55?"color:var(--brand-ink)":""}`:(`background:${colorFor(p)};${p>.55?"color:var(--brand-ink)":""}`);
      html+=`<button class="cell ${exam?"exam":""} ${mock?"mock":""} ${rev?"rev":""} ${finalrev?"finalrev":""} ${sun?"sun":""} ${hol?"holiday":""} ${iso===TODAY?"today":""}" data-d="${iso}" style="${bgStyle}" title="${fmt(iso,{day:"numeric",month:"short"})} · ${hol?"Holiday":esc(d.p)}${hol?"":" · "+Math.round(p*100)+"%"}">${n}${(mock||sun)&&!exam?'<span class="dot"></span>':""}</button>`;
    }
    html+=`</div></div>`;

  $("#view").innerHTML=html+"</div>";

function mockChart(){
  const subj=PCODES, W=Math.max(640,PCODES.length*120),H=240,pl=34,pb=28,pt=10, gw=(W-pl)/PCODES.length, bw=Math.min(26,gw/4.6);
  const y=v=>pt+(H-pt-pb)*(1-v/100);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mock scores by paper">`;
  for(const t of [0,40,BENCH,100]) s+=`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="${t===BENCH?"var(--gold)":"var(--line)"}" stroke-dasharray="${t===BENCH?"5 4":""}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`;
  subj.forEach((sb,i)=>{
    const cx=pl+gw*i+gw/2;
    [1,2,3].forEach((n,j)=>{ const v=S.scores[SK(n,sb)]; const x=cx+(j-1)*(bw+4)-bw/2; if(v!=null&&v!==""){ s+=`<rect x="${x}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="4" fill="var(--c)" class="s-${sb}" opacity="${.45+j*.27}"/><text x="${x+bw/2}" y="${y(v)-4}" text-anchor="middle">${v}</text>`; } else s+=`<rect x="${x}" y="${y(0)-3}" width="${bw}" height="3" rx="1" fill="var(--line)"/>`; });
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${sb} · M1–M3</text>`;
  });
  return s+`</svg>`;
}
function testChart(tests){
  const W=640,H=200,pl=34,pb=26,pt=12,n=tests.length, step=(W-pl-12)/Math.max(n-1,1);
  const y=v=>pt+(H-pt-pb)*(1-v/100);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly test scores">`;
  for(const t of [0,50,75,100]) s+=`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="${t===75?"var(--gold)":"var(--line)"}" stroke-dasharray="${t===75?"5 4":""}"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`;
  const pts=tests.map((d,i)=>({x:pl+6+i*step,v:S.tests[d.d],d:d.d})).filter(p=>p.v!=null&&p.v!=="");
  if(pts.length>1) s+=`<polyline fill="none" stroke="var(--brand)" stroke-width="2.5" points="${pts.map(p=>p.x+","+y(p.v)).join(" ")}"/>`;
  pts.forEach((p,i)=>{ s+=`<circle cx="${p.x}" cy="${y(p.v)}" r="${i===pts.length-1?5:3.5}" fill="var(--brand)"/>`; });
  tests.forEach((d,i)=>{ if(i%2===0) s+=`<text x="${pl+6+i*step}" y="${H-8}" text-anchor="middle">${fmt(d.d,{day:"numeric",month:"short"})}</text>`; });
  if(!pts.length) s+=`<text x="${W/2}" y="${H/2}" text-anchor="middle">Log a Sunday test score on the Today tab to start the line</text>`;
  return s+`</svg>`;
}

/* ---------- My plan: attempt, start date & hours ---------- */
let DRAFT=null, DRAFT_PRESET="full";
const MONTHNAME=m=>new Date(m+"-01T00:00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
const hasProgress=()=>Object.values(S.days).some(d=>d.t&&Object.keys(d.t).length);
const started=()=>DAYS.length && TODAY>=DAYS[0].d && hasProgress();
function replanOpts(from, newAttempt){
  const planned={}, done={};
  for(const d of DAYS) for(const t of TASKS[d.d]) if(t.uid && t.h){ planned[t.uid]=(planned[t.uid]||0)+t.h; if(isDone(d.d,t.id)) done[t.uid]=(done[t.uid]||0)+t.h; }
  const remain={}; for(const u in planned) remain[u]=Math.max(0,1-(done[u]||0)/planned[u]);

  if(switching){ const na=ENGINE.attemptOf(CFG,newAttempt); (na.restudy||[]).forEach(s=>{ for(const u in remain) if(u.includes("|"+s+" Ch ")) delete remain[u]; }); }

    : ratio>=.75?`Slightly compressed — about ${pct}% of the recommended time. An extra hour on weekends closes the gap.`

function switchCoursePlan(targetId){
  // Build the target's initial state: copy over remain keys that belong to target's subjects
  const targetSubjects=COURSE_SUBJECTS[targetId];
  const targetKey="arivupro-rankroad-"+targetId+"-jan27-v2";
  // Compute current remain from this plan's progress
  const myRemain=started()?replanOpts(TODAY).remain:{};
  // Filter only keys whose subject is in target
  const targetRemain={};
  for(const uid in myRemain){
    const subj=uid.split("|")[1]&&uid.split("|")[1].split(" ")[0];
    if(targetSubjects.includes(subj)) targetRemain[uid]=myRemain[uid];
  }
  // Read existing target data (preserve name, scores, etc.)
  let existing={name:"",phone:"",email:"",leadSent:false,days:{},scores:{},tests:{},rating:{},errs:{},seenBadges:[],plan:null};
  try{ const t=JSON.parse(localStorage.getItem(targetKey)); if(t) existing=t; }catch(e){}
  // Apply settings from current plan, overwrite remain with migrated keys
  const settings=S.plan?JSON.parse(JSON.stringify(S.plan.settings)):null;
  if(settings) existing.plan={settings,from:null,remain:targetRemain,mocksDone:0,frozen:[]};
  // Copy name/contact if target has none
  if(!existing.name) existing.name=S.name||"";
  if(!existing.phone) existing.phone=S.phone||"";
  if(!existing.email) existing.email=S.email||"";
  try{ localStorage.setItem(targetKey,JSON.stringify(existing)); }catch(e){}

function applyPlan(settings){
  settings=JSON.parse(JSON.stringify(settings));
  if(started()){
    const o=replanOpts(TODAY, settings.attempt);
    for(const d in S.days) if(d>=TODAY && S.days[d].t) delete S.days[d].t;     // their work is carried in 'remain'
    S.plan={settings, from:o.from, remain:o.remain, mocksDone:o.mocksDone, frozen:o.frozen, attemptFrom:o.attemptFrom};
  } else {
    S.plan = {settings, from:null, remain:{}, mocksDone:0, frozen:[]};
    for(const d in S.days) if(S.days[d].t) delete S.days[d].t;
  }
  save(); flush(); regen(); prevBadges=new Set(badgeList().filter(b=>b[3]).map(b=>b[1]));
  selDay=defaultDay(); refreshHeader(); renderPlan(); toast(started()?"Plan updated from today":"Your "+ATT.label+" plan is ready");

/* ---------- roadmap journey ---------- */
function renderRoadmap(){
  // Build milestone list from plan data
  const milestones=[];
  const phaseRange=PLANINFO.stats&&PLANINFO.stats.phaseRange||{};
  const mockDates=PLANINFO.stats&&PLANINFO.stats.mockDates||{};

  // Helper: fraction of tasks done for a date range
  function rangePct(from,to){
    let done=0,total=0;
    for(const d of DAYS){
      if(d.d<from||d.d>to) continue;
      const ts=TASKS[d.d]; total+=ts.length; done+=ts.filter(t=>isDone(d.d,t.id)).length;
    }
    return total?done/total:0;
  }
  function firstDayOf(phase){ return phaseRange[phase]&&phaseRange[phase][0]; }
  function lastDayOf(phase){ return phaseRange[phase]&&phaseRange[phase][1]; }

  // Start milestone
  milestones.push({id:"start",label:"Day 1",sub:"Plan begins",icon:"🚀",kind:"start",date:DAYS[0].d,pct:()=>rangePct(DAYS[0].d,DAYS[0].d)});

  // Phase 1 — find the actual phase key(s) in phaseRange that start with "Phase 1"
  const p1Keys=Object.keys(phaseRange).filter(k=>k.startsWith("Phase 1"));
  const p1end=p1Keys.length?p1Keys.reduce((a,k)=>phaseRange[k][1]>a?phaseRange[k][1]:a,""):"";
  const p1start=p1Keys.length?p1Keys.reduce((a,k)=>(!a||phaseRange[k][0]<a)?phaseRange[k][0]:a,""):"";
  if(p1end) milestones.push({id:"p1",label:"Phase 1 done",sub:"First reading complete",icon:"📖",kind:"phase",date:p1end,pct:()=>rangePct(p1start||DAYS[0].d,p1end)});

  // Mocks — mockDates keys are numbers 1/2/3
  for(let mn=1;mn<=3;mn++){
    const mds=mockDates[mn];
    if(!mds||!mds.length) continue;
    const mEnd=mds[mds.length-1];
    const mStart=mds[0];
    const agg=mockAgg(mn);
    const mockPct=(ms,me)=>()=>{
      let done=0,total=0;
      for(const d of DAYS){ if(d.d<ms||d.d>me) continue; const ts=TASKS[d.d]; total+=ts.length; done+=ts.filter(t=>isDone(d.d,t.id)).length; }
      return total?done/total:0;
    };
    const score=agg!=null?` · ${Math.round(agg)}/${PCODES.length*100}`:"";
    milestones.push({id:"mock"+mn,label:"Mock "+mn,sub:"Full mock"+score,icon:"📝",kind:"mock",date:mEnd,pct:mockPct(mStart,mEnd)});
  }

  // Revision 1
  const r1end=lastDayOf("Revision 1");
  if(r1end) milestones.push({id:"r1",label:"Revision 1",sub:"Re-read & PYQs",icon:"🔁",kind:"rev",date:r1end,pct:()=>rangePct(firstDayOf("Revision 1")||DAYS[0].d,r1end)});

  // Revision 2
  const r2end=lastDayOf("Revision 2");
  if(r2end) milestones.push({id:"r2",label:"Revision 2",sub:"Deep revision",icon:"⚡",kind:"rev",date:r2end,pct:()=>rangePct(firstDayOf("Revision 2")||DAYS[0].d,r2end)});

  // Final revision
  const frend=lastDayOf("Final Revision")||lastDayOf("FINAL REV");
  if(frend) milestones.push({id:"fr",label:"Final Revision",sub:"Formula sheets & MCQs",icon:"🎯",kind:"rev",date:frend,pct:()=>rangePct(firstDayOf("Final Revision")||firstDayOf("FINAL REV")||DAYS[0].d,frend)});

  // Exam papers
  for(const p of PAPERS){
    const[eDate,eCode,eName]=p;
    const pct=()=>rangePct(eDate,eDate);
    milestones.push({id:"exam-"+eCode,label:eCode,sub:eName.replace(/^Paper \d+\s*[–-]\s*/,""),icon:"🏆",kind:"exam",date:eDate,pct});
  }

  // Sort by date, deduplicate
  milestones.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const seen=new Set(); const nodes=milestones.filter(m=>{ if(seen.has(m.id)) return false; seen.add(m.id); return true; });

  // Compute state for each node
  function nodeState(m){
    const p=m.pct();
    if(m.date<TODAY||(m.date===TODAY&&p>0.05)) return p>=0.99?"done":"active";
    if(m.date===TODAY) return "active";
    if(m.date>TODAY) return p>0.05?"active":"locked";
    return "done";
  }

  // Overall progress
  const overall=planPct();
  const totalDays=DAYS.length, doneDays=DAYS.filter(d=>dayPct(d.d)>=0.8).length;

  // Build HTML
  let html=`<div class="sectionhead rm-header"><h2>Your Journey</h2><span class="muted">${overall}% complete · ${doneDays} of ${totalDays} days at 80%+</span></div>
  <div class="rm-wrap">`;

  // Progress bar across top
  html+=`<div style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:5px"><span>Start</span><span>${overall}%</span><span>Exam day</span></div><div class="meter" style="height:8px"><i class="${overall>=80?"good":overall>=50?"warn":"bad"}" style="width:${overall}%;transition:width 1s"></i></div></div>`;

  // Journey path — zigzag layout (right → left → right)
  html+=`<div class="rm-track">`;

  nodes.forEach((m,idx)=>{
    const state=nodeState(m);
    const p=m.pct();
    const pctStr=Math.round(p*100)+"%";
    const isRight=idx%2===0;
    const isExam=m.kind==="exam";
    const isMock=m.kind==="mock";

    // Ring fill SVG inside bubble
    const r=28,c=2*Math.PI*r,offset=c*(1-p);
    const ringColor=isExam?"var(--law)":isMock?"var(--gold)":"var(--brand)";
    const ringSvg=`<svg class="ring" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="6"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${ringColor}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 36 36)" style="transition:stroke-dashoffset .8s"/></svg>`;

    const xpBadge=state==="done"&&m.kind!=="start"?`<div class="rm-xp-badge">✓ done</div>`:(state==="active"?`<div class="rm-xp-badge" style="background:var(--gold-soft)">${pctStr}</div>`:"");

    const nodeHtml=`<div class="rm-node ${state} ${isExam?"exam":""}" tabindex="${state!=="locked"?0:-1}" data-date="${m.date}" title="${esc(m.label)} – ${esc(m.sub)} · ${pctStr}">
      <div class="rm-bubble">${ringSvg}<span class="rm-icon">${m.icon}</span></div>
      <div class="rm-label">${esc(m.label)}</div>
      <div class="rm-pct">${esc(m.sub)}</div>
      ${xpBadge}
    </div>`;

    // Row: alternating left/right alignment
    html+=`<div class="rm-row ${isRight?"":"left"}">${nodeHtml}</div>`;

    // Connector curve to next node
    if(idx<nodes.length-1){
      const nextNode=nodes[idx+1];
      const connFill=state==="done"||(state==="active"&&p>0.3)?"1":"0";
      // Curve goes from current side to opposite side
      const x1=isRight?64:16,x2=isRight?16:64;
      const pathD=`M ${x1} 0 C ${x1} 32, ${x2} 16, ${x2} 48`;
      const pathLen=72; // approximate
      const connClass=nextNode.kind==="exam"||m.kind==="exam"?"exam-conn":"";
      html+=`<div class="rm-connector ${connClass}" style="width:80px">
        <svg viewBox="0 0 80 48" preserveAspectRatio="none">
          <path class="rm-path" d="${pathD}"/>
          <path class="rm-path-fill" d="${pathD}" stroke-dasharray="${pathLen}" stroke-dashoffset="${pathLen*(1-+connFill)}" style="stroke:${nextNode.kind==='exam'||m.kind==='exam'?'var(--law)':'var(--brand)'}"/>
        </svg>
      </div>`;
    }
  });

  html+=`</div></div>`;

  // Legend
  html+=`<div class="legend" style="margin-top:16px"><span><i style="background:var(--brand)"></i>Done</span><span><i style="background:var(--gold)"></i>In progress</span><span><i style="background:var(--surface-2)"></i>Upcoming</span><span><i style="background:var(--law)"></i>Exam</span></div>`;

  $("#view").innerHTML=html;

  // Click handlers — go to that day's Today view
  document.querySelectorAll(".rm-node[data-date]").forEach(el=>{
    el.onclick=()=>{
      const d=el.dataset.date;
      if(IDX[d]!==undefined){ selDay=d; show("today"); }
      else {
        // exam day or out-of-range: go to nearest plan day
        const nearest=DAYS.reduce((a,b)=>Math.abs(b.d.localeCompare(d))<Math.abs(a.d.localeCompare(d))?b:a);
        selDay=nearest.d; show("today");
      }
    };
    el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); el.click(); } };
  });
}

    || ["scores", "tests", "rating"].some(k => Object.values(st[k] || {}).some(v => v != null && v !== "" && v !== 0)));
  const getMeta = c => ls.get(metaKey(c)) || {uid: null, rev: 0, dirty: false};

  /* the course this device has been used for most recently (or has the most progress in) */
  function localCourse() {

    for (const c of COURSES) {

  function lev(a, b) {
    const d = Array.from({length: a.length + 1}, (_, i) => [i]);
